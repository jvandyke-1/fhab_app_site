<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:

    This is a placeholder for base href that will be replaced by the value of

  <base href="/fhab_app_site/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Field data collection app for SWAMP-FHAB.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="SWAMP-FHAB">
  <link rel="apple-touch-icon" href="icons/Icon-192.png?v=1.2">

  <link rel="manifest" href="manifest.json?v=1.2">
</head>
<body>
<script>
  // FORCE SERVICE WORKER REGISTRATION
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('flutter_service_worker.js?v=1.2', {scope: './'})
        .then(function (reg) {
          console.log('OFFLINE ENGINE UPDATED:', reg);
        }).catch(function (err) {
          console.error('OFFLINE ENGINE FAILED:', err);
        });
    });
  }
</script>
<script src="flutter_bootstrap.js" async></script>
